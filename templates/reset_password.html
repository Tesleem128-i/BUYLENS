<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — BuyLens</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-glow"></div>
<a href="{{ url_for('index') }}" class="auth-back">&larr; Back to BuyLens</a>

<div class="auth-card">
  <div class="auth-card__mark">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="BuyLens">
    <span>BUY<b>LENS</b></span>
  </div>

  <div class="auth-eyebrow">Account Recovery</div>
  <h1 class="auth-title">Choose a new password.</h1>
  <p class="auth-sub">Make it something you haven't used before.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="auth-flash auth-flash--{{ 'error' if category == 'error' else 'info' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form class="auth-form" method="POST" action="{{ url_for('reset_password', token=token) }}">
    <div class="auth-field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required autofocus>
    </div>
    <div class="auth-field">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required>
    </div>

    <button type="submit" class="auth-submit">Reset password</button>
  </form>

  <p class="auth-switch">Changed your mind? <a href="{{ url_for('login') }}">Back to log in</a></p>
</div>

</body>
</html>
